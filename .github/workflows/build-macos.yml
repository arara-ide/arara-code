name: Build macOS

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      runner:
        type: string
        required: true
      arch:
        type: string
        required: true

      ai:
        type: string
        required: true
      bot:
        type: string
        required: true
      orchestra:
        type: string
        required: true

permissions:
  contents: read

env:
  ARARA_AI_REPO: arara-ide/arara-ai
  ARARA_BOT_REPO: arara-ide/arara-bot
  ARARA_ORCHESTRA_REPO: arara-ide/arara-orchestra
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      ARARA_MACOS_SIGN_IDENTITY: ${{ vars.ARARA_MACOS_SIGN_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Checkout arara-ai
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARARA_AI_REPO }}
          ref: ${{ inputs.ai }}
          token: ${{ vars.ENVS_REPO_PAT || secrets.ENVS_REPO_PAT }}
          path: arara-ai
          persist-credentials: false

      - name: Checkout arara-bot
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARARA_BOT_REPO }}
          ref: ${{ inputs.bot }}
          token: ${{ vars.ENVS_REPO_PAT || secrets.ENVS_REPO_PAT }}
          path: arara-bot
          persist-credentials: false

      - name: Checkout arara-orchestra
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARARA_ORCHESTRA_REPO }}
          ref: ${{ inputs.orchestra }}
          token: ${{ vars.ENVS_REPO_PAT || secrets.ENVS_REPO_PAT }}
          path: arara-orchestra
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: upstream/vscodium/.nvmrc

      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: macos-npm-${{ inputs.arch }}-${{ hashFiles('upstream/vscodium/upstream/stable.json') }}-${{ inputs.ai }}-${{ inputs.bot }}-${{ inputs.orchestra }}
          restore-keys: |
            macos-npm-${{ inputs.arch }}-${{ hashFiles('upstream/vscodium/upstream/stable.json') }}-

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependências
        run: |
          brew install gpatch jq
          mkdir -p "$HOME/gnubin"
          ln -sf "$(brew --prefix gpatch)/bin/gpatch" "$HOME/gnubin/patch"
          echo "$HOME/gnubin" >> "$GITHUB_PATH"
          vm_stat | head -3
          sysctl hw.memsize

      - name: Conferir arquitetura do runner
        env:
          EXPECTED_ARCH: ${{ inputs.arch }}
        run: |
          actual="$(uname -m)"
          case "$EXPECTED_ARCH:$actual" in
            x64:x86_64|arm64:arm64) ;;
            *) echo "::error::Runner $actual não corresponde a $EXPECTED_ARCH"; exit 1 ;;
          esac

      - name: Importar identidade persistente de assinatura
        env:
          ARARA_MACOS_SIGN_P12_BASE64: ${{ secrets.ARARA_MACOS_SIGN_P12_BASE64 }}
          ARARA_MACOS_SIGN_PASSWORD: ${{ secrets.ARARA_MACOS_SIGN_PASSWORD }}
        run: bash scripts/import-macos-signing.sh

      - name: Testar identidade entre versões
        run: |
          node --test scripts/tests/macos-signing.cjs
          node scripts/tests/macos-signing-live.cjs

      - name: Build
        env:
          MAX_OLD_SPACE_SIZE: '4096'
          ARARA_MACOS_ESBUILD: '1'
          npm_config_audit: 'false'
          npm_config_fund: 'false'
          npm_config_prefer_offline: 'true'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export ARARA_AI_DIR="$(pwd)/arara-ai"
          export ARARA_BOT_DIR="$(pwd)/arara-bot"
          export ARARA_ORCHESTRA_DIR="$(pwd)/arara-orchestra"
          scripts/build.sh

      - name: Conferir versão
        run: |
          . .work/vscodium/dev/build.env
          [ "${RELEASE_VERSION}" = "${{ inputs.version }}" ]
          ls -lh dist

      - name: Testar o binário (abre e traz o arara-ai)
        run: |
          for app in .work/vscodium/VSCode-darwin-${{ inputs.arch }}/*.app; do break; done
          "$app/Contents/Resources/app/bin/arara-code" --version
          test -f "$app/Contents/Resources/app/extensions/arara-ai/package.json"
          test -s "$app/Contents/Resources/app/extensions/arara-ai/dist/extension.js"
          test -s "$app/Contents/Resources/app/extensions/arara-orchestra/dist/webview/webview.js"
          test -s "$app/Contents/Resources/app/extensions/arara-orchestra/dist/extension.js"
          test -s "$app/Contents/Resources/app/extensions/arara-bot/dist/extension.js"
          test -s "$app/Contents/Resources/app/extensions/arara-bot/server/index.js"
          test -s "$app/Contents/Resources/app/extensions/arara-bot/dist/webview.js"
          test -s "$app/Contents/Resources/app/extensions/arara-bot/dist/hub.js"
          codesign --verify --deep "$app"

      - name: Criar DMG
        env:
          ARCH: ${{ inputs.arch }}
        run: |
          mkdir -p release
          bash scripts/package-macos-dmg.sh dist release "$RELEASE_VERSION" "$ARCH"
          (cd release && shasum -a 256 *.dmg > SHA256SUMS)

      - name: Testar DMG real nesta arquitetura
        env:
          ARCH: ${{ inputs.arch }}
        run: bash scripts/test-macos-dmg.sh "release/AraraCode-darwin-${ARCH}-${RELEASE_VERSION}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'development' && format('arara-code-development-macos-{0}', inputs.arch) || format('macos-{0}', inputs.arch) }}
          compression-level: 0
          path: |
            release/*.dmg
            release/SHA256SUMS
          retention-days: 14
          if-no-files-found: error

      - name: Remover chaveiro temporário
        if: always() && env.ARARA_MACOS_SIGN_KEYCHAIN != ''
        run: security delete-keychain "$ARARA_MACOS_SIGN_KEYCHAIN"
