name: Deploy

# Todo push na main compila e publica a release, sem depender do filtro de
# caminhos do Build (que continua valendo para a development). O build de
# release é o mesmo: este workflow só chama o `build.yml` existente.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/build.yml
    secrets: inherit
