name: Review external PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'gabsrodrigues-dev' &&
      github.event.pull_request.user.login != github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR for static analysis only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          persist-credentials: false
          submodules: false

      - name: Review shell scripts
        uses: reviewdog/action-shellcheck@d0b8d5fd7fad6afdb6e1b6ce1778892be4d1f427
        with:
          reporter: github-pr-review
          filter_mode: added
          fail_level: error
          path: scripts
          shellcheck_flags: --norc

      - name: Review GitHub Actions
        if: always()
        uses: reviewdog/action-actionlint@130b9f8cde9887817aceb1bd1c823ce1357bbdde
        with:
          reporter: github-pr-review
          filter_mode: added
          fail_level: error
          actionlint_flags: -shellcheck= -pyflakes=
