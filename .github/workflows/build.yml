  release:
    # Publica mesmo que Windows/macOS falhem (Linux é a plataforma estável); eles entram quando passarem.
    if: ${{ !cancelled() && needs.linux.result == 'success' && github.ref == 'refs/heads/main' }}
    # needs: [version, linux, windows, macos]  # <- use esta ao reativar o macOS
    needs: [version, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      V: ${{ needs.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        run: |
          cd dist
          ls -lh
          sha256sum ./* > SHA256SUMS

      - name: Texto da release
        run: |
          {
            echo "Versão de teste."
            echo
            # seção do CHANGELOG desta versão ou, na falta, a de "Não lançado"
            awk -v v="$V" '
              /^## \[/ { if (on) exit; if (index($0, "[" v "]") || index($0, "[Não lançado]")) { on=1; next } }
              on { print }
            ' CHANGELOG.md
            echo
            echo "### Instalar ou atualizar (Ubuntu/Debian)"
            echo "Baixe o \`.deb\` abaixo e rode:"
            echo
            echo "    sudo apt install ./arara-code_${V}_amd64.deb"
            echo
            echo "Para atualizar, é o mesmo comando com o arquivo novo. Suas configurações ficam."
            echo
            echo "### Desinstalar"
            echo
            echo "    arara-code-uninstall          # mantém configurações"
            echo "    arara-code-uninstall --all    # apaga tudo"
            if ls dist/*.exe >/dev/null 2>&1; then
              echo
              echo "### Windows (teste)"
              echo "Baixe \`AraraCodeUserSetup-x64-${V}.exe\` (só para o seu usuário) ou \`AraraCodeSetup-x64-${V}.exe\` (todos os usuários) e execute."
              echo "Também há o \`.zip\`, sem instalar. O instalador ainda não é assinado: o Windows pode avisar."
            fi
            if ls dist/*darwin*.zip >/dev/null 2>&1; then
              echo
              echo "### macOS (teste)"
              echo "Baixe o \`AraraCode-darwin-arm64-${V}.zip\` (Apple Silicon) ou \`AraraCode-darwin-x64-${V}.zip\` (Intel), descompacte e arraste o app para Aplicativos."
              echo "O app não é notarizado. Na primeira vez, rode no Terminal:"
              echo
              echo "    xattr -cr \"/Applications/Arara Code.app\""
            fi
          } > release-notes.md

      - name: Conferir workflows da main
        run: |
          git fetch --no-tags --depth=1 origin main
          if ! git diff --quiet "${GITHUB_SHA}" FETCH_HEAD -- .github/workflows; then
            echo "::error::A main mudou arquivos em .github/workflows depois deste build começar; o GITHUB_TOKEN não pode criar a tag ${V} em ${GITHUB_SHA}. Rode o workflow de novo (workflow_dispatch) na main atual."
            git diff --stat "${GITHUB_SHA}" FETCH_HEAD -- .github/workflows
            exit 1
          fi

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease == false && 'false' || 'true' }}
        run: |
          flag=()
          [ "${PRERELEASE}" = "true" ] && flag+=(--prerelease)
          gh release create "$V" dist/* \
            --target "${GITHUB_SHA}" --title "Arara Code $V" \
            --notes-file release-notes.md "${flag[@]}"
