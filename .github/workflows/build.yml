  #         for app in .work/vscodium/VSCode-darwin-${{ matrix.arch }}/*.app; do break; done
  #         "$app/Contents/Resources/app/bin/arara-code" --version
  #         test -f "$app/Contents/Resources/app/extensions/arara-ai/package.json"
  #         test -s "$app/Contents/Resources/app/extensions/arara-ai/dist/extension.js"
  #         test -s "$app/Contents/Resources/app/extensions/arara-ai/dist/orquestra/webview.js"
