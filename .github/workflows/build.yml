name: Build

on:
  push:
    branches: [main, development]
    paths:
      - 'patches/**'
      - '.gitattributes'
      - 'locales/**'
      - 'scripts/**'
      - 'branding/**'
      - 'upstream/**'
      - 'extensions.lock.json'
      - 'CHANGELOG.md'
      - '.github/workflows/**'
      - 'README.md'
      - 'AGENTS.md'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publicar como pre-release (versão de teste)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  ARARA_AI_REPO: arara-ide/arara-ai
  ARARA_BOT_REPO: arara-ide/arara-bot
  ARARA_ORCHESTRA_REPO: arara-ide/arara-orchestra
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  verify:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar scripts e empacotamento
        run: |
          for f in scripts/*.sh; do bash -n "$f"; done
          node --check scripts/apply-environment.cjs
          node scripts/tests/patches.cjs
          node scripts/tests/localization.cjs
          node scripts/tests/embed-arara-ai.cjs
          node scripts/tests/embed-arara-bot.cjs
          node scripts/tests/embed-arara-orchestra.cjs
          node scripts/tests/terminal.cjs
          node --test scripts/tests/publish-release.cjs

  version:
    needs: verify
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - id: v
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(jq -r '.tag' upstream/vscodium/upstream/stable.json)"
          base_patch=$(( $(date +%-j) * 24 + $(date +%-H) ))
          patch="$(printf '%04d' $base_patch)"
          release="${tag}${patch}"
          while git ls-remote --exit-code --tags origin "refs/tags/${release}" >/dev/null 2>&1 || gh release view "${release}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; do
            echo "Versão ${release} já existe. Incrementando patch automaticamente..."
            base_patch=$(( base_patch + 1 ))
            patch="$(printf '%04d' $base_patch)"
            release="${tag}${patch}"
          done
          echo "release=${release}" >> "$GITHUB_OUTPUT"

  linux:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Checkout arara-ai
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARARA_AI_REPO }}
          ref: ${{ github.ref_name }}
          token: ${{ vars.ENVS_REPO_PAT || secrets.ENVS_REPO_PAT }}
          path: arara-ai
          persist-credentials: false

      - name: Checkout arara-bot
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARARA_BOT_REPO }}
          ref: ${{ github.ref_name }}
          token: ${{ vars.ENVS_REPO_PAT || secrets.ENVS_REPO_PAT }}
          path: arara-bot
          persist-credentials: false

      - name: Checkout arara-orchestra
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARARA_ORCHESTRA_REPO }}
          ref: ${{ github.ref_name }}
          token: ${{ vars.ENVS_REPO_PAT || secrets.ENVS_REPO_PAT }}
          path: arara-orchestra
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: upstream/vscodium/.nvmrc

      - name: Liberar disco e instalar dependências
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            jq rsync fakeroot dpkg-dev desktop-file-utils libkrb5-dev libx11-dev libxkbfile-dev libsecret-1-dev
          df -h /

      - name: Swap extra (o build chega a ~13 GB de RAM)
        run: |
          sudo fallocate -l 8G /swapfile2
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          free -h

      - name: Testar empacotamento AppImage
        run: node --test scripts/tests/appimage.cjs

      - name: Build
        env:
          ARARA_AI_DIR: ${{ github.workspace }}/arara-ai
          ARARA_BOT_DIR: ${{ github.workspace }}/arara-bot
          ARARA_ORCHESTRA_DIR: ${{ github.workspace }}/arara-orchestra
          MAX_OLD_SPACE_SIZE: '8192'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/build.sh

      - name: Conferir versão e gerar hashes
        run: |
          . .work/vscodium/dev/build.env
          [ "${RELEASE_VERSION}" = "${{ needs.version.outputs.release }}" ]
          ls -lh dist

      - name: Validar artefatos
        run: |
          dpkg-deb -c dist/*.deb | grep -E "applications/arara-code.desktop|extensions/arara-ai/package.json|extensions/arara-bot/package.json|extensions/arara-orchestra/package.json|bin/arara-code-uninstall"
          test -x dist/AraraCode-linux-x64-*.AppImage
          APPIMAGE_EXTRACT_AND_RUN=1 timeout 120 dist/AraraCode-linux-x64-*.AppImage --version

      - name: Testar o binário (abre e traz o arara-ai)
        run: |
          d=.work/vscodium/VSCode-linux-x64
          timeout 120 "$d/bin/arara-code" --version
          ELECTRON_RUN_AS_NODE=1 "$d/arara-code" "$PWD/scripts/test-terminal.cjs" "$PWD/$d/resources/app"
          test -f "$d/resources/app/extensions/arara-ai/package.json"
          test -s "$d/resources/app/extensions/arara-ai/dist/extension.js"
          test -s "$d/resources/app/extensions/arara-orchestra/dist/extension.js"
          test -s "$d/resources/app/extensions/arara-orchestra/dist/webview/webview.js"
          test -s "$d/resources/app/extensions/arara-bot/dist/extension.js"
          test -s "$d/resources/app/extensions/arara-bot/server/index.js"
          test -s "$d/resources/app/extensions/arara-bot/dist/webview.js"
          test -s "$d/resources/app/extensions/arara-bot/dist/hub.js"

      - name: Hashes do build de development
        if: github.ref == 'refs/heads/development'
        run: (cd dist && sha256sum ./* > SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'development' && 'arara-code-development-linux' || 'linux' }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

  windows:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'
    needs: version
    runs-on: windows-2022
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.release }}
    steps:
      - name: Caminhos longos
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Checkout arara-ai
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARARA_AI_REPO }}
          ref: ${{ github.ref_name }}
          token: ${{ vars.ENVS_REPO_PAT || secrets.ENVS_REPO_PAT }}
          path: arara-ai
          persist-credentials: false

      - name: Checkout arara-bot
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARARA_BOT_REPO }}
          ref: ${{ github.ref_name }}
          token: ${{ vars.ENVS_REPO_PAT || secrets.ENVS_REPO_PAT }}
          path: arara-bot
          persist-credentials: false

      - name: Checkout arara-orchestra
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ARARA_ORCHESTRA_REPO }}
          ref: ${{ github.ref_name }}
          token: ${{ vars.ENVS_REPO_PAT || secrets.ENVS_REPO_PAT }}
          path: arara-orchestra
          persist-credentials: false

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: upstream/vscodium/.nvmrc

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build
        env:
          ARARA_AI_DIR_NAME: arara-ai
          MAX_OLD_SPACE_SIZE: '8192'
          CI_BUILD: 'no'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export ARARA_AI_DIR="$(pwd)/arara-ai"
          export ARARA_BOT_DIR="$(pwd)/arara-bot"
          export ARARA_ORCHESTRA_DIR="$(pwd)/arara-orchestra"
          scripts/build.sh

      - name: Conferir versão
        run: |
          . .work/vscodium/dev/build.env
          [ "${RELEASE_VERSION}" = "${{ needs.version.outputs.release }}" ]
          ls -lh dist
          test -f "dist/AraraCodeSetup-x64-${RELEASE_VERSION}.exe"
          test -z "$(find dist -name '*UserSetup*' -print -quit)"

      - name: Testar o binário (abre e traz o arara-ai)
        run: |
          d=.work/vscodium/VSCode-win32-x64
          timeout 120 "$d/bin/arara-code" --version
          test -f "$d/resources/app/extensions/arara-ai/package.json"
          test -s "$d/resources/app/extensions/arara-ai/dist/extension.js"
          test -s "$d/resources/app/extensions/arara-orchestra/dist/extension.js"
          test -s "$d/resources/app/extensions/arara-orchestra/dist/webview/webview.js"
          test -s "$d/resources/app/extensions/arara-bot/dist/extension.js"
          test -s "$d/resources/app/extensions/arara-bot/server/index.js"
          test -s "$d/resources/app/extensions/arara-bot/dist/webview.js"
          test -s "$d/resources/app/extensions/arara-bot/dist/hub.js"

      - name: Hashes do build de development
        if: github.ref == 'refs/heads/development'
        run: (cd dist && sha256sum ./* > SHA256SUMS)

      - name: Enviar instalador para assinatura
        id: unsigned-windows
        if: github.ref == 'refs/heads/main' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: dist/AraraCodeSetup-x64-${{ env.RELEASE_VERSION }}.exe
          retention-days: 1
          if-no-files-found: error

      - name: Assinar instalador com SignPath
        if: github.ref == 'refs/heads/main' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned-windows.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-windows

      - name: Conferir assinatura do instalador
        if: github.ref == 'refs/heads/main' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        run: |
          $installer = "dist/AraraCodeSetup-x64-$env:RELEASE_VERSION.exe"
          Copy-Item "signed-windows/AraraCodeSetup-x64-$env:RELEASE_VERSION.exe" $installer -Force
          $signature = Get-AuthenticodeSignature $installer
          if ($signature.Status -ne 'Valid') { throw "Assinatura Authenticode inválida: $($signature.Status)" }
          $signature.SignerCertificate.Subject

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name == 'development' && 'arara-code-development-windows' || 'windows' }}
          path: dist/
          retention-days: 14
          if-no-files-found: error

  attest-windows:
    if: github.ref == 'refs/heads/main'
    needs: [version, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - name: Atestar procedência do instalador Windows
        uses: actions/attest@v4
        with:
          subject-path: dist/AraraCodeSetup-x64-${{ needs.version.outputs.release }}.exe

  macos-x64:
    if: github.ref == 'refs/heads/main'
    needs: version
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.version.outputs.release }}
      runner: macos-15-intel
      arch: x64
    secrets: inherit

  macos-arm64:
    if: github.ref == 'refs/heads/main'
    needs: version
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ needs.version.outputs.release }}
      runner: macos-15
      arch: arm64
    secrets: inherit

  release-linux:
    if: github.ref == 'refs/heads/main'
    needs: [version, linux]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release.yml
    with:
      version: ${{ needs.version.outputs.release }}
      artifact: linux
      prerelease: ${{ github.event_name != 'workflow_dispatch' || inputs.prerelease }}

  release-windows:
    if: github.ref == 'refs/heads/main'
    needs: [version, windows, attest-windows]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release.yml
    with:
      version: ${{ needs.version.outputs.release }}
      artifact: windows
      prerelease: ${{ github.event_name != 'workflow_dispatch' || inputs.prerelease }}

  release-macos-x64:
    if: github.ref == 'refs/heads/main'
    needs: [version, macos-x64]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release.yml
    with:
      version: ${{ needs.version.outputs.release }}
      artifact: macos-x64
      prerelease: ${{ github.event_name != 'workflow_dispatch' || inputs.prerelease }}

  release-macos-arm64:
    if: github.ref == 'refs/heads/main'
    needs: [version, macos-arm64]
    permissions:
      contents: write
    uses: ./.github/workflows/publish-release.yml
    with:
      version: ${{ needs.version.outputs.release }}
      artifact: macos-arm64
      prerelease: ${{ github.event_name != 'workflow_dispatch' || inputs.prerelease }}
